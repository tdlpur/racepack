<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrega de Números</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #111;
      text-align: center;
      padding: 30px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 5px;
    }

    .updated {
      font-size: 18px;
      margin-bottom: 30px;
    }

    .dashboard {
      max-width: 1100px;
      margin: auto;
      background: white;
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 12px 35px rgba(0,0,0,.12);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 35px;
      align-items: center;
    }

    .pie {
      width: 360px;
      height: 360px;
      border-radius: 50%;
      margin: auto;
      background: conic-gradient(#2da8de 0deg, #ddd 0deg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pie-center {
      width: 210px;
      height: 210px;
      border-radius: 50%;
      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 12px rgba(0,0,0,.08);
    }

    .percent {
      font-size: 54px;
      font-weight: 800;
    }

    .label {
      font-size: 18px;
      color: #555;
    }

    .cards {
      display: grid;
      gap: 18px;
    }

    .card {
      border-radius: 18px;
      padding: 24px;
      background: #f7f9fc;
      text-align: left;
      border-left: 10px solid #2da8de;
    }

    .card.pending {
      border-left-color: #ddd;
    }

    .card.total {
      border-left-color: #111;
    }

    .card-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .number {
      font-size: 46px;
      font-weight: 800;
    }

    @media (max-width: 800px) {
      .dashboard {
        grid-template-columns: 1fr;
      }

      .pie {
        width: 280px;
        height: 280px;
      }

      .pie-center {
        width: 170px;
        height: 170px;
      }

      .percent {
        font-size: 42px;
      }
    }
  </style>
</head>

<body>

  <h1>Entrega de Números</h1>
  <div class="updated">Actualización automática cada 30 segundos</div>

  <div class="dashboard">
    <div>
      <div class="pie" id="pie">
        <div class="pie-center">
          <div class="percent" id="percent">0%</div>
          <div class="label">Entregados</div>
        </div>
      </div>
    </div>

    <div class="cards">
      <div class="card">
        <div class="card-title">Entregados</div>
        <div class="number" id="entregados">0</div>
      </div>

      <div class="card pending">
        <div class="card-title">Pendientes</div>
        <div class="number" id="pendientes">0</div>
      </div>

      <div class="card total">
        <div class="card-title">Total</div>
        <div class="number" id="total">0</div>
      </div>
    </div>
  </div>

  <script>
    const urlEntregados = "https://api.raceresult.com/391661/UGL3T1MUSR7Y40Z0KDVL5RORNOTD44BV";
    const urlPendientes = "https://api.raceresult.com/391661/I03LMQA23BNEYG993OGEXE1EHK74BW1A";

    async function getCount(url) {
      const response = await fetch(url + "?t=" + Date.now());
      const data = await response.json();
      return Array.isArray(data) ? data.length : 0;
    }

    async function updateDashboard() {
      try {
        const entregados = await getCount(urlEntregados);
        const pendientes = await getCount(urlPendientes);
        const total = entregados + pendientes;
        const percent = total > 0 ? Math.round((entregados / total) * 100) : 0;
        const degrees = total > 0 ? (entregados / total) * 360 : 0;

        document.getElementById("entregados").textContent = entregados;
        document.getElementById("pendientes").textContent = pendientes;
        document.getElementById("total").textContent = total;
        document.getElementById("percent").textContent = percent + "%";

        document.getElementById("pie").style.background =
          `conic-gradient(#2da8de 0deg ${degrees}deg, #ddd ${degrees}deg 360deg)`;

      } catch (error) {
        console.error("Error cargando datos:", error);
      }
    }

    updateDashboard();
    setInterval(updateDashboard, 30000);
  </script>

</body>
</html>
